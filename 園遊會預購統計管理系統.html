<main class="container-fluid px-3 px-md-4 mt-4">
  <header class="school-banner text-white p-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div>
      <span class="badge bg-warning text-dark mb-2"><i class="fa-solid fa-cake-candles me-1"></i>林口康橋 9 週年校慶</span>
      <h1 class="h2 fw-bold mb-1">園遊會預購統計管理系統</h1>
      <p class="mb-0">學生預購、教職員薪資代扣與家長會代表預購統計（NT$150／張）</p>

    <div class="d-flex gap-2 flex-wrap">

  <section id="metrics" class="row g-3 mb-4" aria-label="預購總覽"></section>

    <li class="nav-item"><button class="nav-link" id="summary-tab" data-bs-toggle="tab" data-bs-target="#summary-pane" type="button" role="tab" aria-selected="false"><i class="fa-solid fa-chart-column me-2"></i>年級／班級統計報表</button></li>
    <li class="nav-item"><button class="nav-link" id="staff-tab" data-bs-toggle="tab" data-bs-target="#staff-pane" type="button" role="tab" aria-selected="false"><i class="fa-solid fa-briefcase me-2"></i>教職員專區（<span id="staffCount"></span>）</button></li>

          <div class="col-md-4 d-flex gap-2 flex-wrap justify-content-md-end">

    <section class="tab-pane fade admin-only" id="settings-pane" role="tabpanel" aria-labelledby="settings-tab">

        <div class="col-md-6"><div class="panel p-4 h-100">
          <h2 class="h5 fw-bold text-primary">學生園遊券預購單費用檔</h2>

          <h2 class="h5 fw-bold text-primary">全校學生總名單</h2>
          <p class="text-secondary">支援學號（Student ID）、班級（HR）、座號（Seat No.）、姓名（C_Name）。</p>
          <button class="upload-zone fw-bold" data-upload="rosterFileInput"><i class="fa-solid fa-user-plus d-block fs-2 mb-2"></i>選擇全校學生名單（.xlsx、.xls、.csv）</button>

    <div class="modal-header bg-danger text-white"><h2 class="modal-title h6" id="passwordTitle">管理員身分驗證</h2><button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="關閉"></button></div>

    <div class="d-flex"><div id="toastMessage" class="toast-body"></div><button type="button" class="btn-close btn-close-white m-auto me-2" data-bs-dismiss="toast" aria-label="關閉"></button></div>
  </div>

<script>
"use strict";

const TICKET_PRICE = 150;
const ADMIN_PASSCODE = "LKC11209007";
const DEFAULT_SHEET = "https://docs.google.com/spreadsheets/d/1shHLfI8o6y9ncx7mfdTkSkPJwAl1pJpfi_aYmmIRU9Y/edit#gid=1217985089";
const grades = ["7", "8", "9", "10", "11", "12"];
const baseClasses = [
  ["701","林子媺",37], ["702","*陳朝聖",37], ["703","許皓筑",37], ["704","孫建文",37],
  ["7A","俞聖君",27], ["7B","陳銘偉",27], ["7C","陳靖",27], ["7D","許珮珊",27], ["7E","李昱穎",26], ["7F","戴如意",26],
  ["801","胡馨尹",37], ["802","簡靖晟",35], ["803","柯怡安",36], ["804","*李銘仁",36],
  ["8A","吳智偉",26], ["8B","賴盈螢",26], ["8C","呂昕璇",27], ["8D","蔡筑青",26], ["8E","呂幸枝",26], ["8F","姚思岑",26],
  ["901","陳英封",36], ["902","鄞安妤",35], ["903","陳詩慧",35], ["904","余佳玲",35],
  ["9A","貢嘉慧",26], ["9B","吳家羽",26], ["9C","陳曉筠",26], ["9D","張浩堂",26], ["9E","王姵文",24], ["9F","*張沛寧",24],
  ["1001","黃筱凌",41], ["1002","許芷雲",40], ["10A","*尹旭威",30], ["10B","程昱霖",31], ["10C","陳妙筑",30], ["10D","杜海寧",30], ["10E","錢世亮",28],
  ["1101","胡立信",38], ["1102","巫淑玲",39], ["11A","王品懿",27], ["11B","莊永華",26], ["11C","郭育誠",26], ["11D","*黃煌宜",28], ["11E","曹立姸",23],
  ["1201","張仕奎",34], ["1202","邱大維",39], ["12A","王喬",26], ["12B","*廖英延",27], ["12C","李語桐",27], ["12D","黃勛",27], ["12E","張財興",24]
].map(([code, teacher, count]) => ({
  code, teacher, count,
  grade: code.replace(/(?:[A-F]|[0-9]{2})$/, ""),
  track: /[A-F]$/.test(code) ? "留學班" : "雙語班"
}));

const byId = id => document.getElementById(id);
const text = value => String(value ?? "").trim();
const format = new Intl.NumberFormat("zh-TW");
const money = value => "NT$" + format.format(value);
const knownClasses = new Set(baseClasses.map(group => group.code));
const spreadsheetKey = "kcis_google_sheet_url";
let sheetUrl = DEFAULT_SHEET;
let isAdmin = false;
let roster = new Map();
let orders = new Map();
let staff = [];
let parents = [];
let groups = [];
let gradeChart;
let categoryChart;

const reports = {
  summary: {
    title: "全校班級園遊券預購彙整表（NT$150／張）", button: "匯出報表 CSV",
    filename: "班級園遊券預購統計.csv", panel: "summaryPanel",
    columns: ["班級","學制","導師","班級人數","預購人數","總預購張數","總金額"],
    rows: () => groups.map(g => [g.code,g.track,g.teacher,g.total,g.ordered,g.qty,g.qty*TICKET_PRICE])
  },
  staff: {
    title: "教職員園遊券預購名冊", button: "匯出教職員名冊",
    filename: "教職員園遊券預購名冊.csv", panel: "staffPanel",
    columns: ["序號","填表時間","處室／單位","教職員姓名","分機／電話","薪資代扣意願","預購張數","金額"],
    rows: () => staff.map((row,index) => [index+1,row.time,row.dept,row.name,row.phone,row.consent,row.qty,row.qty*TICKET_PRICE])
  },
  parent: {
    title: "家長會班級代表園遊券預購名冊", button: "匯出家長代表名冊",
    filename: "家長代表園遊券預購名冊.csv", panel: "parentPanel",
    columns: ["序號","填表時間","代表班級","家長姓名","聯絡電話","子女姓名","子女學號","預購張數","金額"],
    rows: () => parents.map((row,index) => [index+1,row.time,row.code,row.name,row.phone,row.child,row.studentId,row.qty,row.qty*TICKET_PRICE])
  }
};

function quantity(value) {
  const normalized = text(value).normalize("NFKC").replace(/[\s,]/g,"").replace(/張$/,"");
  return /^\d+$/.test(normalized) && Number.isSafeInteger(Number(normalized)) ? Number(normalized) : 0;
}

function normalizeClass(value) {
  return text(value).normalize("NFKC").toUpperCase().replace(/\s/g,"").replace(/班$/,"");
}

function ticketCount(rows) {
  return rows.reduce((sum,row) => sum + row.qty, 0);
}

function setToast(message) {
  byId("toastMessage").textContent = message;
  if (window.bootstrap) bootstrap.Toast.getOrCreateInstance(byId("liveToast"), {delay:4200}).show();
  else window.alert(message);
}

function importRows(rows, isRoster) {
  const records = new Map();
  let skipped = 0;
  for (const row of rows) {
    const code = normalizeClass(row["班級"] ?? row["班級\nHR"] ?? row.Class);
    const id = text(row["學號"] ?? row["學號\nStudent ID"]);
    const name = text(row["姓名"] ?? row["姓名\nC_Name"]);
    const seat = quantity(row["座號"] ?? row["座號\nSeat No."]);
    const qty = isRoster ? 0 : quantity(row["數量"] ?? row["預購張數"] ?? row["張數"]);
    if (!knownClasses.has(code) || (!id && !name)) {
      skipped++;
      continue;
    }
    const key = id ? "id:" + id : "name:" + JSON.stringify([code,seat,name]);
    const previous = records.get(key);
    records.set(key,{code,id,name,seat,qty:qty + (previous?.qty ?? 0)});
  }
  return {records,skipped};
}

async function importFile(input, isRoster) {
  const file = input.files[0];
  if (!file) return;
  input.value = "";
  if (!window.XLSX) {
    setToast("Excel 讀取元件未載入。請確認網路連線後重新開啟頁面。");
    return;
  }
  try {
    const book = XLSX.read(await file.arrayBuffer(), {type:"array",codepage:65001,raw:true});
    const sheet = book.Sheets[book.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet,{raw:false});
    const {records,skipped} = importRows(rows,isRoster);
    if (!records.size) throw new Error("找不到可匯入的班級及學生欄位");
    if (isRoster) roster = records;
    else orders = records;
    renderAll();
    const detail = skipped ? "，略過 " + skipped + " 列無法辨識的資料" : "";
    setToast((isRoster ? "學生名單" : "學生預購") + "匯入完成，共 " + records.size + " 人" + detail + "。");
  } catch (error) {
    setToast("匯入失敗。 " + error.message);
  }
}

function compileGroups() {
  const members = new Map(roster);
  for (const [key,order] of orders) {
    const student = members.get(key);
    members.set(key, student ? {...student,qty:order.qty} : order);
  }
  const byClass = new Map(baseClasses.map(group => [group.code,[]]));
  for (const student of members.values()) byClass.get(student.code).push(student);
  const rosterCounts = new Map();
  for (const student of roster.values()) {
    rosterCounts.set(student.code,(rosterCounts.get(student.code) ?? 0) + 1);
  }
  return baseClasses.map(group => {
    const students = byClass.get(group.code);
    return {
      ...group, students,
      total: Math.max(rosterCounts.get(group.code) ?? group.count, students.length),
      ordered: students.filter(student => student.qty > 0).length,
      qty: ticketCount(students)
    };
  });
}

function metricCard(label, value, detail, icon, theme) {
  const cell = document.createElement("div");
  cell.className = "col-xl-3 col-sm-6";
  cell.innerHTML = '<div class="panel h-100 p-3"><div class="d-flex justify-content-between align-items-center gap-2 mb-2"><span class="metric-label fw-semibold text-secondary"></span><span class="metric-icon bg-opacity-10"><i class="fa-solid"></i></span></div><div class="metric-value h3 fw-bold mb-1"></div><div class="metric-detail small text-secondary"></div></div>';
  cell.querySelector(".metric-label").textContent = label;
  cell.querySelector(".metric-value").textContent = value;
  cell.querySelector(".metric-detail").textContent = detail;
  cell.querySelector(".metric-icon").classList.add("bg-" + theme,"text-" + theme);
  cell.querySelector("i").classList.add("fa-" + icon);
  return cell;
}

function renderMetrics() {
  const total = groups.reduce((sum,group) => sum + group.total,0);
  const ordered = groups.reduce((sum,group) => sum + group.ordered,0);
  const studentQty = ticketCount(groups);
  const staffQty = ticketCount(staff);
  const parentQty = ticketCount(parents);
  const ratio = total ? Math.round(ordered / total * 100) : 0;
  byId("metrics").replaceChildren(
    metricCard("學生預購總人數",format.format(ordered) + " 人","全校 " + format.format(total) + " 人・預購比例 " + ratio + "%","user-graduate","primary"),
    metricCard("學生園遊券預購金額",money(studentQty*TICKET_PRICE),"預購 " + format.format(studentQty) + " 張","ticket","warning"),
    metricCard("教職員預購（人事代扣）",money(staffQty*TICKET_PRICE),staff.length + " 筆・" + format.format(staffQty) + " 張","user-tie","success"),
    metricCard("家長會代表預購",money(parentQty*TICKET_PRICE),parents.length + " 筆・" + format.format(parentQty) + " 張","users","info")
  );
  byId("classCount").textContent = groups.length + " 班";
  byId("staffCount").textContent = staff.length + " 筆";
  byId("parentCount").textContent = parents.length + " 筆";
}

function renderStudentsView() {
  const grade = byId("filterGrade").value;
  const track = byId("filterTrack").value;
  const keyword = text(byId("searchKeyword").value).toLowerCase();
  const grid = byId("classGrid");
  grid.replaceChildren();
  for (const group of groups) {
    if (grade !== "ALL" && group.grade !== grade) continue;
    if (track !== "ALL" && group.track !== track) continue;
    const searchable = [group.code,group.teacher,...group.students.flatMap(student => [student.name,student.id])];
    if (keyword && !searchable.some(value => value.toLowerCase().includes(keyword))) continue;

    const column = document.createElement("div");
    column.className = "col-xl-3 col-lg-4 col-md-6";
    column.innerHTML = '<article class="class-card panel h-100 p-3"><div class="d-flex justify-content-between gap-2 mb-2"><span class="badge bg-primary-subtle text-primary"></span><span class="teacher small text-secondary"></span></div><div class="d-flex align-items-baseline justify-content-between gap-2"><h2 class="h4 fw-bold"></h2><span class="ordered small text-secondary"></span></div><p class="subtotal border-top pt-2 mb-2 small"></p><button class="btn btn-sm btn-outline-primary w-100 fw-bold">查看班級明細</button></article>';
    column.querySelector(".badge").textContent = group.track;
    column.querySelector(".teacher").textContent = group.teacher + " 老師";
    column.querySelector("h2").textContent = group.code + " 班";
    column.querySelector(".ordered").textContent = group.ordered + " / " + group.total + " 人預購";
    column.querySelector(".subtotal").textContent = group.qty + " 張・" + money(group.qty*TICKET_PRICE);
    column.querySelector("button").addEventListener("click",() => openClassModal(group));
    grid.append(column);
  }
  if (!grid.childElementCount) {
    const empty = document.createElement("p");
    empty.className = "text-secondary";
    empty.textContent = "沒有符合篩選條件的班級。";
    grid.append(empty);
  }
}

function fillTable(body, rows, columnCount, emptyMessage) {
  body.replaceChildren();
  for (const values of rows) {
    const row = body.insertRow();
    for (const value of values) row.insertCell().textContent = value;
  }
  if (rows.length) return;
  const cell = body.insertRow().insertCell();
  cell.colSpan = columnCount;
  cell.className = "text-center text-secondary py-4";
  cell.textContent = emptyMessage;
}

function renderReports() {
  for (const [key,report] of Object.entries(reports)) {
    const panel = byId(report.panel);
    if (!panel.firstElementChild) {
      panel.className = "panel";
      panel.innerHTML = '<div class="panel-heading p-3 d-flex justify-content-between align-items-center gap-2 flex-wrap"><h2 class="h5 fw-bold mb-0"></h2><button class="btn btn-sm btn-outline-success fw-bold"></button></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr></tr></thead><tbody></tbody></table></div>';
      panel.querySelector("h2").textContent = report.title;
      const button = panel.querySelector("button");
      button.textContent = report.button;
      button.dataset.export = key;
      for (const label of report.columns) {
        const th = document.createElement("th");
        th.scope = "col";
        th.textContent = label;
        panel.querySelector("thead tr").append(th);
      }
    }
    const rows = report.rows().map(row => [...row.slice(0,-1),money(row.at(-1))]);
    fillTable(panel.querySelector("tbody"),rows,report.columns.length,"目前尚無資料。");
  }
}

function openClassModal(group) {
  byId("classRosterTitle").textContent = group.code + " 班園遊券預購明細";
  const rows = [...group.students].sort((a,b) => a.seat-b.seat).map(student => [
    student.seat || "—",student.id || "—",student.name || "—",student.qty + " 張",money(student.qty*TICKET_PRICE)
  ]);
  fillTable(byId("classRosterBody"),rows,5,"目前尚未匯入此班學生名單或預購資料。");
  byId("classRosterSummaryText").textContent = group.ordered + " 人預購・" + group.qty + " 張・" + money(group.qty*TICKET_PRICE);
  bootstrap.Modal.getOrCreateInstance(byId("classRosterModal")).show();
}

function renderCharts() {
  if (!window.Chart || !byId("summary-pane").classList.contains("active")) return;
  const gradeAmounts = grades.map(grade => ticketCount(groups.filter(group => group.grade === grade))*TICKET_PRICE);
  const categoryAmounts = [ticketCount(groups),ticketCount(staff),ticketCount(parents)].map(qty => qty*TICKET_PRICE);

  if (!gradeChart) {
    gradeChart = new Chart(byId("gradeRevenueChart"),{
      type:"bar",
      data:{labels:grades.map(grade => "G" + grade),datasets:[{data:gradeAmounts,backgroundColor:"#2563eb",borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
    });
    categoryChart = new Chart(byId("categoryPieChart"),{
      type:"doughnut",
      data:{labels:["學生預購","教職員預購","家長會代表"],datasets:[{data:categoryAmounts,backgroundColor:["#2563eb","#10b981","#f59e0b"]}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}
    });
    return;
  }
  gradeChart.data.datasets[0].data = gradeAmounts;
  categoryChart.data.datasets[0].data = categoryAmounts;
  gradeChart.update();
  categoryChart.update();
}

function renderAll() {
  groups = compileGroups();
  renderMetrics();
  renderStudentsView();
  renderReports();
  renderCharts();
}

function csvCell(value) {
  let safe = String(value ?? "");
  if (typeof value !== "number" && /^[\s]*[=+@-]|^[\t\r\n]/.test(safe)) safe = "'" + safe;
  return '"' + safe.replaceAll('"','""') + '"';
}

function exportReport(key) {
  const report = reports[key];
  const csv = [report.columns,...report.rows()].map(row => row.map(csvCell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF",csv],{type:"text/csv;charset=utf-8"}));
  const link = document.createElement("a");
  link.href = url;
  link.download = report.filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url),1000);
}

function sheetCsvUrl(rawUrl) {
  const url = new URL(rawUrl);
  const match = url.pathname.match(/^\/spreadsheets\/d\/([A-Za-z0-9_-]+)(?:\/|$)/);
  if (url.origin !== "https://docs.google.com" || !match) throw new Error("請輸入有效的 Google 試算表連結");
  const gid = url.searchParams.get("gid") ?? new URLSearchParams(url.hash.slice(1)).get("gid") ?? "0";
  if (!/^\d+$/.test(gid)) throw new Error("工作表分頁編號無效");
  return "https://docs.google.com/spreadsheets/d/" + match[1] + "/gviz/tq?tqx=out:csv&gid=" + gid;
}

function headerColumn(headers, keywords, fallback) {
  const index = headers.findIndex(header => keywords.some(keyword => text(header).toLowerCase().includes(keyword.toLowerCase())));
  return index < 0 ? fallback : index;
}

function parseResponses(rows) {
  const [headers,...responses] = rows;
  if (!headers || headers.length < 12) throw new Error("試算表欄位不足，請確認已選擇表單回覆分頁");
  const dept = headerColumn(headers,["所屬單位","Department"],3);
  const staffName = headerColumn(headers,["您的姓名","Full Name"],4);
  const consent = headerColumn(headers,["代扣","Consent"],6);
  const parentName = headerColumn(headers,["家長姓名"],7);
  const childName = headerColumn(headers,["子女姓名"],9);
  const studentId = headerColumn(headers,["子女學號"],10);
  const count = headerColumn(headers,["張數"],11);
  const parentClass = headerColumn(headers,["班代班級","代表班級"],12);
  const nextStaff = [];
  const nextParents = [];
  for (const row of responses) {
    const affiliation = text(row[2]);
    const time = text(row[0]);
    const qty = quantity(row[count]);
    if (/教職員|staff/i.test(affiliation)) {
      nextStaff.push({time,dept:text(row[dept]),name:text(row[staffName]),phone:text(row[5]),consent:text(row[consent]),qty});
    } else if (/家長|parent|代表/i.test(affiliation)) {
      nextParents.push({time,code:normalizeClass(row[parentClass]),name:text(row[parentName]),phone:text(row[8]),child:text(row[childName]),studentId:text(row[studentId]),qty});
    }
  }
  return {staff:nextStaff,parents:nextParents};
}

async function syncSheet() {
  const button = byId("syncButton");
  const status = byId("syncStatusText");
  const bindButton = byId("bindForm").querySelector('button:not([type="button"])');
  button.disabled = bindButton.disabled = true;
  status.textContent = "正在同步 Google 試算表…";
  status.className = "badge rounded-pill border bg-light text-primary py-2 px-3";
  try {
    if (!window.XLSX) throw new Error("資料讀取元件未載入");
    const response = await fetch(sheetCsvUrl(sheetUrl),{cache:"no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const content = await response.text();
    if (/^\s*</.test(content) || response.headers.get("content-type")?.includes("text/html")) {
      throw new Error("試算表未回傳 CSV");
    }
    const book = XLSX.read(content,{type:"string",raw:true});
    const rows = XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,raw:false});
    const result = parseResponses(rows);
    staff = result.staff;
    parents = result.parents;
    renderAll();
    status.textContent = "已同步・教職員 " + staff.length + " 筆・家長代表 " + parents.length + " 筆";
    status.className = "badge rounded-pill border bg-light text-success py-2 px-3";
    setToast("Google 試算表同步完成。");
  } catch (error) {
    status.textContent = "同步失敗";
    status.className = "badge rounded-pill border bg-light text-danger py-2 px-3";
    setToast("同步失敗。請確認分頁及存取權限。 " + error.message);
  } finally {
    button.disabled = bindButton.disabled = false;
  }
}

function setAdmin(value) {
  isAdmin = value;
  if (!value && byId("settings-tab").classList.contains("active")) {
    bootstrap.Tab.getOrCreateInstance(byId("students-tab")).show();
  }
  document.body.classList.toggle("is-admin",value);
  byId("adminBtnText").textContent = value ? "管理員登出" : "管理員登入";
}

document.addEventListener("DOMContentLoaded", () => {
  try {
    sheetUrl = localStorage.getItem(spreadsheetKey) || DEFAULT_SHEET;
  } catch {
    sheetUrl = DEFAULT_SHEET;
  }

  document.addEventListener("click",event => {
    const upload = event.target.closest("[data-upload]");
    const download = event.target.closest("[data-export]");
    if (upload) byId(upload.dataset.upload).click();
    if (download) exportReport(download.dataset.export);
  });
  byId("studentOrderFileInput").addEventListener("change",event => importFile(event.target,false));
  byId("rosterFileInput").addEventListener("change",event => importFile(event.target,true));
  byId("filterGrade").addEventListener("change",renderStudentsView);
  byId("filterTrack").addEventListener("change",renderStudentsView);
  byId("searchKeyword").addEventListener("input",renderStudentsView);
  byId("summary-tab").addEventListener("shown.bs.tab",renderCharts);
  byId("syncButton").addEventListener("click",syncSheet);
  byId("bindSheetModal").addEventListener("show.bs.modal",() => {
    byId("googleSheetUrlInput").value = sheetUrl;
  });
  byId("bindForm").addEventListener("submit",event => {
    event.preventDefault();
    const nextUrl = byId("googleSheetUrlInput").value.trim();
    try {
      sheetCsvUrl(nextUrl);
    } catch (error) {
      setToast(error.message);
      return;
    }
    sheetUrl = nextUrl;
    try {
      localStorage.setItem(spreadsheetKey,sheetUrl);
    } catch {
      // Continue using the link for the current session.
    }
    bootstrap.Modal.getInstance(byId("bindSheetModal")).hide();
    syncSheet();
  });
  byId("adminToggleBtn").addEventListener("click",() => {
    if (isAdmin) {
      setAdmin(false);
      return;
    }
    byId("passwordForm").reset();
    byId("passwordErrorText").hidden = true;
    bootstrap.Modal.getOrCreateInstance(byId("passwordModal")).show();
  });
  byId("passwordForm").addEventListener("submit",event => {
    event.preventDefault();
    if (byId("adminPasswordInput").value.trim() !== ADMIN_PASSCODE) {
      byId("passwordErrorText").hidden = false;
      return;
    }
    setAdmin(true);
    byId("passwordForm").reset();
    bootstrap.Modal.getInstance(byId("passwordModal")).hide();
  });
  renderAll();
});
</script>
